name: Bug report
description: Report a reproducible problem with GrabNetPrinter
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove personal data (names, addresses, LAN IPs, customer data)
        from logs before pasting them.
  - type: input
    id: module-version
    attributes:
      label: GrabNetPrinter version
      placeholder: e.g. 1.1.1 (from the release tag or LSPosed manager)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version / device
      placeholder: e.g. Android 14 (x86_64), Android 13 (arm64)
    validations:
      required: true
  - type: input
    id: root
    attributes:
      label: Root + LSPosed
      placeholder: e.g. KernelSU 0.9.2 + ZygiskNext 1.5.3 + LSPosed 1.11.0
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target app (package and version)
      placeholder: e.g. com.grab.merchant 4.196.0
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer make/model and port
      placeholder: e.g. Xprinter XP-58, raw ESC/POS, port 9100
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `adb logcat -d -s LSPosed-Bridge | grep GrabNetPrinter` and, if available, `adb shell cat /data/local/tmp/grab-netprinter.log`.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The module is enabled and the target app is in its LSPosed scope.
          required: true
        - label: I removed personal/customer data from logs.
          required: true
