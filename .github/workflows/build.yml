name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runner ships an Android SDK; don't use android-actions/setup-android
      # (it still invokes the removed "sdkmanager tools" package and fails).
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y zip unzip curl

      - name: Build
        run: tools/build.sh

      - name: Verify artifacts
        run: tools/verify.sh

      - name: Offline tests
        run: tests/jvm/run.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: grabnetprinter
          path: |
            dist/GrabNetPrinter.apk
            dist/gnp-diag.apk
            dist/grab-netprinter-*.zip
